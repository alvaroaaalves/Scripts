<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Controle de Computadores</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center text-indigo-600">Painel Administrativo</h1>
            <form id="login-form" onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail do Administrador</label>
                    <input type="email" id="email" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="senha" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Entrar</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden">E-mail ou senha incorretos.</p>
            </form>
        </div>
    </div>

    <!-- PAINEL DE CONTROLE (Oculto até logar) -->
    <div id="admin-screen" class="hidden p-6 max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow">
            <h1 class="text-2xl font-bold text-indigo-600">Monitoramento de Equipamentos</h1>
            <button onclick="fazerLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-600 transition">Sair</button>
        </header>

        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-semibold text-lg text-gray-700">Computadores Conectados</h2>
                <button onclick="carregarEquipamentos()" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-indigo-100 transition">Atualizar Lista</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="p-4">Nome da Máquina</th>
                            <th class="p-4">Endereço MAC</th>
                            <th class="p-4">Limite Diário</th>
                            <th class="p-4">Uso Hoje</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-equipamentos" class="divide-y divide-gray-200 text-sm">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONEXÃO E LÓGICA -->
    <script>
        // CONFIGURAÇÕES DO SUPABASE (Insira seus dados reais aqui)
        const SUPABASE_URL = "https://hcyyvetgzscnzjxlwkcj.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjeXl2ZXRnenNjbnpqeGx3a2NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjgxNjMsImV4cCI6MjEwMzA0NDE2M30.7aTHDGL70L05IIvJZHNx5GjdYdozmpewITiqhaAz1NQ";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Verifica se já existe sessão ativa ao carregar a página
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                mostrarPainel();
            }
        });

        async function fazerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erroMsg = document.getElementById('login-error');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: senha,
            });

            if (error) {
                erroMsg.classList.remove('hidden');
            } else {
                erroMsg.classList.add('hidden');
                mostrarPainel();
            }
        }

        async function fazerLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('admin-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function mostrarPainel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.remove('hidden');
            carregarEquipamentos();
            
            // Atualiza a tabela automaticamente a cada 30 segundos
            setInterval(carregarEquipamentos, 30000);
        }

        async function carregarEquipamentos() {
            const { data, error } = await supabaseClient
                .from('equipamentos')
                .select('*')
                .order('nome_maquina', { ascending: true });

            if (error) {
                console.error("Erro ao carregar equipamentos:", error);
                return;
            }

            const tbody = document.getElementById('tabela-equipamentos');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Nenhum computador registrado ainda.</td></tr>`;
                return;
            }

            const agora = new Date();

            data.forEach(eq => {
                // Converte minutos usados para horas e minutos legíveis
                const horasUso = Math.floor(eq.minutos_usados_hoje / 60);
                const minutosUso = eq.minutos_usados_hoje % 60;
                const tempoFormatado = `${horasUso}h ${minutosUso}m`;

                // Verifica se está online (teve sinal nos últimos 2 minutos)
                const ultimaVez = new Date(eq.status_online);
                const diferencaSegundos = (agora - ultimaVez) / 1000;
                const isOnline = diferencaSegundos <= 120;

                const statusBadge = isOnline 
                    ? `<span class="px-2.5 py-1 text-xs font-semibold bg-green-100 text-green-700 rounded-full">Online</span>` 
                    : `<span class="px-2.5 py-1 text-xs font-semibold bg-gray-100 text-gray-600 rounded-full">Offline</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-medium text-gray-900">${eq.nome_maquina}</td>
                    <td class="p-4 text-gray-500 font-mono text-xs">${eq.mac_address}</td>
                    <td class="p-4">${eq.limite_horas}h</td>
                    <td class="p-4 font-semibold text-indigo-600">${tempoFormatado}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 text-center space-x-2">
                        <button onclick="alterarLimite('${eq.id}', ${eq.limite_horas})" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-indigo-700 transition">Editar Limite</button>
                        <button onclick="resetarTempo('${eq.id}')" class="bg-amber-500 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-amber-600 transition">Zerar Uso</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function alterarLimite(id, limiteAtual) {
            const novoLimite = prompt("Digite o novo limite diário em horas (ex: 3.5 ou 4):", limiteAtual);
            if (novoLimite !== null && !isNaN(novoLimite)) {
                const { error } = await supabaseClient
                    .from('equipamentos')
                    .update({ limite_horas: parseFloat(novoLimite) })
                    .eq('id', id);

                if (error) {
                    alert("Erro ao atualizar limite: " + error.message);
                } else {
                    carregarEquipamentos();
                }
            }
        }

        async function resetarTempo(id) {
            if (confirm("Deseja zerar o tempo de uso de hoje para este computador?")) {
                const { error } = await supabaseClient
                    .from('equipamentos')
                    .update({ minutos_usados_hoje: 0 })
                    .eq('id', id);

                if (error) {
                    alert("Erro ao zerar tempo: " + error.message);
                } else {
                    carregarEquipamentos();
                }
            }
        }
    </script>
</body>
</html>
